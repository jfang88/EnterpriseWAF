<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:700 38px Arial;fill:#0A314E}.sub{font:20px Arial;fill:#55616B}.h{font:700 21px Arial;fill:#fff}.t{font:700 17px Arial;fill:#191E23}.s{font:15px Arial;fill:#191E23}.b{fill:#EEF6FB;stroke:#125A82;stroke-width:2}.g{fill:#DCF3D2;stroke:#007878;stroke-width:2}.p{fill:#EEE9FC;stroke:#695AD2;stroke-width:3}.n{fill:#0A314E;stroke:#0A314E;stroke-width:2}.a{stroke:#0A314E;stroke-width:3;fill:none;marker-end:url(#arrow)}.d{stroke:#007878;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0A314E"/></marker>
  </defs>
  <rect width="1600" height="900" fill="white"/>
  <text x="50" y="58" class="title">EnterpriseWAF end-to-end topology</text>
  <text x="50" y="90" class="sub">Internal users and DNS are outside the private cloud; Internal Firewall and CFW are separate boundaries</text>

  <!-- external path -->
  <rect x="35" y="150" rx="12" width="150" height="80" class="b"/><text x="110" y="183" text-anchor="middle" class="t">External users</text><text x="110" y="207" text-anchor="middle" class="s">/ API clients</text>
  <rect x="220" y="150" rx="12" width="160" height="80" class="b"/><text x="300" y="183" text-anchor="middle" class="t">External /</text><text x="300" y="207" text-anchor="middle" class="s">customer DNS</text>
  <rect x="415" y="150" rx="12" width="160" height="80" class="b"/><text x="495" y="183" text-anchor="middle" class="t">Enterprise DNS</text><text x="495" y="207" text-anchor="middle" class="s">/ GTM</text>
  <rect x="610" y="150" rx="12" width="160" height="80" class="b"/><text x="690" y="183" text-anchor="middle" class="t">Leased line</text><text x="690" y="207" text-anchor="middle" class="s">/ VPN</text>
  <path d="M185 190 H220 M380 190 H415 M575 190 H610" class="a"/>

  <!-- internal network -->
  <rect x="35" y="330" rx="18" width="735" height="250" fill="#F7FAFC" stroke="#125A82" stroke-width="3"/>
  <rect x="35" y="330" rx="18" width="735" height="42" class="n"/><text x="402" y="358" text-anchor="middle" class="h">ENTERPRISE INTERNAL NETWORK — OUTSIDE PRIVATE CLOUD</text>
  <rect x="60" y="420" rx="12" width="120" height="80" class="b"/><text x="120" y="452" text-anchor="middle" class="t">Internal users</text><text x="120" y="476" text-anchor="middle" class="s">/ desktops</text>
  <rect x="205" y="420" rx="12" width="120" height="80" class="b"/><text x="265" y="452" text-anchor="middle" class="t">Internal DNS</text>
  <rect x="350" y="420" rx="12" width="130" height="80" class="b"/><text x="415" y="448" text-anchor="middle" class="t">Optional</text><text x="415" y="472" text-anchor="middle" class="s">internal GTM</text>
  <rect x="505" y="420" rx="12" width="130" height="80" class="b"/><text x="570" y="448" text-anchor="middle" class="t">Internal LTM</text><text x="570" y="472" text-anchor="middle" class="s">/ service VIP</text>
  <rect x="660" y="420" rx="12" width="90" height="80" class="b"/><text x="705" y="448" text-anchor="middle" class="t">Internal</text><text x="705" y="472" text-anchor="middle" class="s">Firewall</text>
  <path d="M180 460 H205 M325 460 H350 M480 460 H505 M635 460 H660" class="a"/>

  <!-- Site 1 -->
  <rect x="820" y="120" rx="18" width="360" height="650" fill="white" stroke="#0A314E" stroke-width="3"/>
  <rect x="820" y="120" rx="18" width="360" height="48" class="n"/><text x="1000" y="153" text-anchor="middle" class="h">SITE 1 — PRIMARY</text>
  <rect x="870" y="205" rx="12" width="260" height="58" class="b"/><text x="1000" y="240" text-anchor="middle" class="t">Edge firewall / application VIP</text>
  <rect x="870" y="282" rx="12" width="260" height="58" class="b"/><text x="1000" y="317" text-anchor="middle" class="t">Tenant LTM HA pair</text>
  <rect x="870" y="359" rx="12" width="260" height="58" class="b"/><text x="1000" y="394" text-anchor="middle" class="t">WAF enforcement tier</text>
  <path d="M1000 263 V282 M1000 340 V359" class="a"/>
  <rect x="850" y="450" rx="18" width="300" height="280" class="p"/><text x="1000" y="480" text-anchor="middle" fill="#695AD2" font-family="Arial" font-weight="700" font-size="18">PRIVATE CLOUD BOUNDARY</text>
  <rect x="885" y="510" rx="12" width="230" height="48" class="b"/><text x="1000" y="540" text-anchor="middle" class="t">Private-cloud CFW</text>
  <rect x="885" y="580" rx="12" width="230" height="48" class="b"/><text x="1000" y="610" text-anchor="middle" class="t">ELB / service</text>
  <rect x="885" y="650" rx="12" width="230" height="52" class="g"/><text x="1000" y="681" text-anchor="middle" class="t">App A / B / C / D</text>
  <path d="M1000 417 V510 M1000 558 V580 M1000 628 V650" class="a"/>
  <path d="M750 460 C790 460 815 530 885 534" class="a"/>

  <!-- Site 2 -->
  <rect x="1230" y="120" rx="18" width="330" height="650" fill="white" stroke="#0A314E" stroke-width="3"/>
  <rect x="1230" y="120" rx="18" width="330" height="48" class="n"/><text x="1395" y="153" text-anchor="middle" class="h">SITE 2 — DR</text>
  <rect x="1275" y="260" rx="12" width="240" height="58" class="b"/><text x="1395" y="295" text-anchor="middle" class="t">Tenant LTM HA pair</text>
  <rect x="1275" y="337" rx="12" width="240" height="58" class="b"/><text x="1395" y="372" text-anchor="middle" class="t">WAF enforcement tier</text>
  <rect x="1260" y="450" rx="18" width="270" height="280" class="p"/><text x="1395" y="480" text-anchor="middle" fill="#695AD2" font-family="Arial" font-weight="700" font-size="18">PRIVATE CLOUD</text>
  <rect x="1290" y="510" rx="12" width="210" height="48" class="b"/><text x="1395" y="540" text-anchor="middle" class="t">CFW</text>
  <rect x="1290" y="580" rx="12" width="210" height="48" class="b"/><text x="1395" y="610" text-anchor="middle" class="t">ELB / service</text>
  <rect x="1290" y="650" rx="12" width="210" height="52" class="g"/><text x="1395" y="681" text-anchor="middle" class="t">App A / B / C — DR</text>
  <path d="M1395 318 V337 M1395 395 V510 M1395 558 V580 M1395 628 V650" class="a"/>

  <!-- contingency -->
  <path d="M1130 388 C1190 388 1210 366 1275 366" class="d"/><text x="1200" y="350" text-anchor="middle" class="s">X2A remote WAF</text>
  <path d="M1290 534 C1215 534 1200 534 1150 534" class="d"/><text x="1205" y="520" text-anchor="middle" class="s">X2B route-back</text>
  <path d="M1115 680 C1190 680 1215 680 1290 680" class="d"/><text x="1205" y="667" text-anchor="middle" class="s">XD1 remote App B fallback</text>

  <rect x="180" y="815" rx="14" width="1240" height="48" class="g"/><text x="800" y="845" text-anchor="middle" class="t">Healthy local services must not depend on the inter-site link. Internal Firewall and CFW must be monitored and tested separately.</text>
</svg>
