<rect x="65" y="785" width="1470" height="65" fill="#ebf8e9" stroke="#5ca452" stroke-width="2" rx="14"/>
<text x="800" y="814" text-anchor="middle" class="tx" font-size="16" font-weight="bold">Fixed: GTM is inside the edge firewall • both sites have 2 × 2 edge firewalls • same GTM service is used by selected external + internal DNS names</text>
<text x="800" y="838" text-anchor="middle" class="tx" font-size="16" font-weight="bold">Internal firewall is distinct from CFW • GTM synchronization does not imply cross-site probing • cross-site paths are contingency only</text>
