<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#073b64"/></marker>
  <marker id="t" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f8b8d"/></marker>
  <style>.tx{font-family:Arial,sans-serif;fill:#162432}.h{font-family:Arial,sans-serif;fill:white;font-weight:bold}.b{stroke:#073b64;stroke-width:2;rx:14}.f{stroke:#073b64;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#0f8b8d;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#t)}.o{stroke:#d17714;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#a)}</style>
</defs>
<rect width="1600" height="900" fill="#f8fafc"/>
<text x="55" y="55" class="tx" font-size="34" font-weight="bold">EnterpriseWAF — Target Layered Health-Monitoring Model</text>
<text x="58" y="88" class="tx" font-size="19" fill="#536575">GTM owns site/DNS health; local LTM/ELB owns member recovery; app teams own the readiness contract.</text>

<rect x="35" y="140" width="165" height="76" fill="#f5f8fb" class="b"/><text x="118" y="172" text-anchor="middle" class="tx" font-size="18" font-weight="bold">External DNS /</text><text x="118" y="198" text-anchor="middle" class="tx" font-size="18" font-weight="bold">users</text>
<rect x="35" y="520" width="165" height="76" fill="#f5f8fb" class="b"/><text x="118" y="552" text-anchor="middle" class="tx" font-size="18" font-weight="bold">Internal DNS /</text><text x="118" y="578" text-anchor="middle" class="tx" font-size="18" font-weight="bold">users</text>

<!-- Site1 -->
<rect x="235" y="115" width="490" height="600" fill="white" stroke="#073b64" stroke-width="2" rx="18"/>
<rect x="235" y="115" width="490" height="48" fill="#073b64" rx="18"/><text x="480" y="148" text-anchor="middle" class="h" font-size="26">Site 1</text>
<rect x="260" y="188" width="135" height="54" fill="#dcf5f8" class="b"/><text x="328" y="221" text-anchor="middle" class="tx" font-size="17" font-weight="bold">Edge FW 2×2</text>
<rect x="420" y="188" width="135" height="54" fill="#dff5c1" class="b"/><text x="488" y="221" text-anchor="middle" class="tx" font-size="17" font-weight="bold">GTM cluster</text>
<rect x="580" y="188" width="120" height="54" fill="#dcf5f8" class="b"/><text x="640" y="221" text-anchor="middle" class="tx" font-size="17" font-weight="bold">Tenant LTM</text>
<rect x="580" y="275" width="120" height="52" fill="#ccefed" class="b"/><text x="640" y="307" text-anchor="middle" class="tx" font-size="18" font-weight="bold">WAF</text><path d="M640 242 V275" class="f"/>
<rect x="255" y="365" width="445" height="270" fill="#ede8ff" stroke="#5c4cd2" stroke-width="3" rx="24"/>
<rect x="285" y="398" width="105" height="52" fill="#dcf5f8" class="b"/><text x="338" y="430" text-anchor="middle" class="tx" font-size="18" font-weight="bold">CFW</text>
<rect x="420" y="398" width="110" height="52" fill="#dcf5f8" class="b"/><text x="475" y="430" text-anchor="middle" class="tx" font-size="18" font-weight="bold">ELB</text>
<rect x="560" y="398" width="110" height="52" fill="#dff5c1" class="b"/><text x="615" y="430" text-anchor="middle" class="tx" font-size="18" font-weight="bold">App</text>
<path d="M390 424 H420" class="f"/><path d="M530 424 H560" class="f"/>
<rect x="285" y="500" width="135" height="50" fill="#dcf5f8" class="b"/><text x="353" y="532" text-anchor="middle" class="tx" font-size="16" font-weight="bold">Internal VIP</text>
<rect x="450" y="500" width="145" height="50" fill="#dcf5f8" class="b"/><text x="523" y="532" text-anchor="middle" class="tx" font-size="16" font-weight="bold">B service VIP</text>
<rect x="615" y="500" width="65" height="50" fill="#dff5c1" class="b"/><text x="648" y="522" text-anchor="middle" class="tx" font-size="14">App B/C</text><text x="648" y="540" text-anchor="middle" class="tx" font-size="14">deps</text>
<path d="M640 327 L338 398" class="f"/><path d="M595 525 H615" class="f"/>

<!-- Site2 -->
<rect x="755" y="115" width="490" height="600" fill="white" stroke="#073b64" stroke-width="2" rx="18"/>
<rect x="755" y="115" width="490" height="48" fill="#073b64" rx="18"/><text x="1000" y="148" text-anchor="middle" class="h" font-size="26">Site 2</text>
<rect x="780" y="188" width="135" height="54" fill="#dcf5f8" class="b"/><text x="848" y="221" text-anchor="middle" class="tx" font-size="17" font-weight="bold">Edge FW 2×2</text>
<rect x="940" y="188" width="135" height="54" fill="#dff5c1" class="b"/><text x="1008" y="221" text-anchor="middle" class="tx" font-size="17" font-weight="bold">GTM cluster</text>
<rect x="1100" y="188" width="120" height="54" fill="#dcf5f8" class="b"/><text x="1160" y="221" text-anchor="middle" class="tx" font-size="17" font-weight="bold">Tenant LTM</text>
<rect x="1100" y="275" width="120" height="52" fill="#ccefed" class="b"/><text x="1160" y="307" text-anchor="middle" class="tx" font-size="18" font-weight="bold">WAF</text><path d="M1160 242 V275" class="f"/>
<rect x="775" y="365" width="445" height="270" fill="#ede8ff" stroke="#5c4cd2" stroke-width="3" rx="24"/>
<rect x="805" y="398" width="105" height="52" fill="#dcf5f8" class="b"/><text x="858" y="430" text-anchor="middle" class="tx" font-size="18" font-weight="bold">CFW</text>
<rect x="940" y="398" width="110" height="52" fill="#dcf5f8" class="b"/><text x="995" y="430" text-anchor="middle" class="tx" font-size="18" font-weight="bold">ELB</text>
<rect x="1080" y="398" width="110" height="52" fill="#dff5c1" class="b"/><text x="1135" y="430" text-anchor="middle" class="tx" font-size="18" font-weight="bold">App</text>
<path d="M910 424 H940" class="f"/><path d="M1050 424 H1080" class="f"/>
<rect x="805" y="500" width="135" height="50" fill="#dcf5f8" class="b"/><text x="873" y="532" text-anchor="middle" class="tx" font-size="16" font-weight="bold">Internal VIP</text>
<rect x="970" y="500" width="145" height="50" fill="#dcf5f8" class="b"/><text x="1043" y="532" text-anchor="middle" class="tx" font-size="16" font-weight="bold">B service VIP</text>
<rect x="1135" y="500" width="65" height="50" fill="#dff5c1" class="b"/><text x="1168" y="522" text-anchor="middle" class="tx" font-size="14">App B/C</text><text x="1168" y="540" text-anchor="middle" class="tx" font-size="14">deps</text>
<path d="M1160 327 L858 398" class="f"/><path d="M1115 525 H1135" class="f"/>

<!-- Sync and DNS paths -->
<path d="M555 215 H940" class="d"/><path d="M940 232 H555" class="d"/><text x="748" y="190" text-anchor="middle" class="tx" font-size="15" fill="#0f8b8d">GTM sync / shared probing responsibility</text>
<path d="M200 178 C260 178,330 185,420 215" class="o"/><path d="M200 558 C280 510,350 330,420 215" class="o"/>

<!-- H3/H4/H5 -->
<path d="M488 242 C500 280,560 292,640 302" class="d"/><text x="430" y="310" class="tx" font-size="15" fill="#0f8b8d">H3 external VIP L7</text>
<path d="M488 242 C440 330,390 410,353 500" class="d"/><text x="245" y="485" class="tx" font-size="15" fill="#0f8b8d">H4 internal VIP L7</text>
<path d="M523 550 H615" class="d"/><text x="455" y="590" class="tx" font-size="15" fill="#0f8b8d">H5 dependency health</text>
<rect x="320" y="660" width="360" height="42" fill="#ebf8e9" stroke="#5ca452" stroke-width="2" rx="12"/><text x="500" y="687" text-anchor="middle" class="tx" font-size="16" font-weight="bold">H2 local LTM / ELB member health</text>

<!-- Right contract -->
<rect x="1280" y="130" width="285" height="370" fill="#ebf8e9" stroke="#073b64" stroke-width="2" rx="18"/>
<rect x="1280" y="130" width="285" height="48" fill="#073b64" rx="18"/><text x="1422" y="162" text-anchor="middle" class="h" font-size="22">App-team health contract</text>
<text x="1305" y="220" class="tx" font-size="17">• Host/SNI + URI</text><text x="1305" y="254" class="tx" font-size="17">• Expected status / body</text><text x="1305" y="288" class="tx" font-size="17">• Auth/cert/token if required</text><text x="1305" y="322" class="tx" font-size="17">• Critical dependencies only</text><text x="1305" y="356" class="tx" font-size="17">• Timeout / maintenance semantics</text><text x="1305" y="390" class="tx" font-size="17">• Named application owner</text>
<rect x="1280" y="540" width="285" height="130" fill="#f5f8fb" stroke="#0f8b8d" stroke-width="2" rx="18"/><text x="1422" y="574" text-anchor="middle" class="tx" font-size="20" font-weight="bold" fill="#0f8b8d">H6 independent synthetic</text><text x="1305" y="608" class="tx" font-size="16">• external user-like transaction</text><text x="1305" y="635" class="tx" font-size="16">• internal user-like transaction</text><text x="1305" y="662" class="tx" font-size="16">• SLO evidence / confirmation</text>

<rect x="75" y="780" width="1450" height="68" fill="#fff0f0" stroke="#be3144" stroke-width="2" rx="14"/>
<text x="800" y="808" text-anchor="middle" class="tx" font-size="17" font-weight="bold" fill="#be3144">Avoid false green: listener up while CFW/ELB/application is broken. Avoid false red: a non-critical dependency triggers broad withdrawal.</text>
<text x="800" y="835" text-anchor="middle" class="tx" font-size="16" font-weight="bold">GTM decides site/DNS; local LTM/ELB decides members. Healthy local service must not depend solely on the inter-site link.</text>
</svg>