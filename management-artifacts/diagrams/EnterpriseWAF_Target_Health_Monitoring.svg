<!-- ================= RIGHT COLUMN: CONTRACTS & SYNTHETICS ================= -->
<rect x="1322" y="128" width="254" height="316" rx="14" fill="#ebf8e9" stroke="#073b64" stroke-width="2"/>
<rect x="1322" y="128" width="254" height="40" rx="11" fill="#073b64"/>
<rect x="1322" y="154" width="254" height="14" fill="#073b64"/>
<text x="1449" y="154" text-anchor="middle" class="h" font-size="16">App health contract (App Teams)</text>
<text x="1338" y="198" class="tx" font-size="13">• Host / TLS SNI + readiness URI</text>
<text x="1338" y="228" class="tx" font-size="13">• Expected HTTP status / body</text>
<text x="1338" y="258" class="tx" font-size="13">• Auth / cert / token if needed</text>
<text x="1338" y="288" class="tx" font-size="13">• Critical dependencies only</text>
<text x="1338" y="318" class="tx" font-size="13">• Receive Disable drain (K12818)</text>
<text x="1338" y="348" class="tx" font-size="13">• Virtual Server Reject on down</text>
<text x="1338" y="378" class="tx" font-size="13">• Named application owner</text>
<text x="1449" y="422" text-anchor="middle" class="tx" font-size="13" font-weight="bold" fill="#073b64">Avoid false green and false red.</text>

<rect x="1322" y="468" width="254" height="256" rx="14" fill="#f5f8fb" stroke="#0f8b8d" stroke-width="2"/>
<rect x="1322" y="468" width="254" height="40" rx="11" fill="#0f8b8d"/>
<rect x="1322" y="494" width="254" height="14" fill="#0f8b8d"/>
<text x="1449" y="494" text-anchor="middle" class="h" font-size="15">H6: Independent Synthetic</text>
<text x="1338" y="534" class="tx" font-size="12.5" font-weight="bold" fill="#073b64">Outside-F5 business checks:</text>
<text x="1338" y="560" class="tx" font-size="13">• External user-like transaction</text>
<text x="1338" y="588" class="tx" font-size="13">• Internal user-like transaction</text>
<text x="1338" y="616" class="tx" font-size="13">• API / business transaction</text>
<text x="1338" y="648" class="sub" font-size="12">Measures real 99.95% availability</text>
<text x="1338" y="668" class="sub" font-size="12">(SLO) &amp; validates failover; catches</text>
<text x="1338" y="686" class="sub" font-size="12">WAF 403 blocks &amp; expired certs.</text>
<text x="1338" y="710" class="tx" font-size="11.5" font-weight="bold" fill="#0f8b8d">Use Specific Prober Pools (K08433560)</text>

<!-- Bottom Green Banner -->
<rect x="36" y="776" width="1540" height="62" rx="12" fill="#ebf8e9" stroke="#5ca452" stroke-width="2"/>
<text x="806" y="803" text-anchor="middle" class="tx" font-size="15" font-weight="bold" fill="#073b64">Decision owner vs probe origin: GTM owns the DNS/site decision, but probes must cross the logical CFW → local ELB → App (K8s/VM) path.</text>
<text x="806" y="825" text-anchor="middle" class="sub" font-size="13.5">Huawei private-cloud timings — CFW (T9), ELB (T10), K8s (T11) &amp; VM (T12) — remain TBD until measured; do not assume cross-site CFW state sync.</text>

