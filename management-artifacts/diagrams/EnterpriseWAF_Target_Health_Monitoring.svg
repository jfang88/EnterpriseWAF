  <marker id="tealArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8.5,3 z" fill="#0f8b8d"/></marker>
  <marker id="tealStart" markerWidth="9" markerHeight="9" refX="0.5" refY="3" orient="auto"><path d="M8.5,0 L8.5,6 L0,3 z" fill="#0f8b8d"/></marker>
  <marker id="orangeArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8.5,3 z" fill="#d17714"/></marker>
  <style>
    .tx{font-family:Liberation Sans,Arial,sans-serif;fill:#162432}
    .sub{font-family:Liberation Sans,Arial,sans-serif;fill:#536575}
    .h{font-family:Liberation Sans,Arial,sans-serif;fill:#ffffff;font-weight:bold}
    .b{stroke:#073b64;stroke-width:1.8;rx:11}
    .flow{stroke:#073b64;stroke-width:2.6;fill:none;marker-end:url(#navyArrow)}
    .health{stroke:#0f8b8d;stroke-width:2.4;fill:none;stroke-dasharray:8 6;marker-end:url(#tealArrow)}
    .sync{stroke:#0f8b8d;stroke-width:2.8;fill:none;stroke-dasharray:7 5;marker-start:url(#tealStart);marker-end:url(#tealArrow)}
