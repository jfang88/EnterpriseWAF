<!-- Title & Legend -->
<text x="36" y="44" class="tx" font-size="29" font-weight="bold" fill="#073b64">End-to-end target layered health-monitoring architecture</text>
<text x="38" y="70" class="sub" font-size="15">BIG-IP DNS (GTM) owns site/DNS decisions; L7 probes traverse the logical CFW edge → site-local ELB → App (BIG-IP 17.5.x / 21.1.x+).</text>

