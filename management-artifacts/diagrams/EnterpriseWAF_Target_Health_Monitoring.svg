<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <marker id="navyArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#073b64"/></marker>
  <marker id="tealArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f8b8d"/></marker>
  <style>
    .tx{font-family:Arial,sans-serif;fill:#162432}
    .h{font-family:Arial,sans-serif;fill:white;font-weight:bold}
    .b{stroke:#073b64;stroke-width:2;rx:14}
    .flow{stroke:#073b64;stroke-width:3;fill:none;marker-end:url(#navyArrow)}
    .health{stroke:#0f8b8d;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#tealArrow)}
    .sync{stroke:#0f8b8d;stroke-width:3;fill:none;stroke-dasharray:8 7}
    .dns{stroke:#d17714;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#navyArrow)}
  </style>
</defs>
<rect width="1600" height="900" fill="#f8fafc"/>
<text x="50" y="52" class="tx" font-size="34" font-weight="bold">EnterpriseWAF - Target Layered Health-Monitoring Architecture</text>
<text x="52" y="85" class="tx" font-size="18" fill="#536575">GTM owns site/DNS decisions; probe origin is selected to exercise the path represented by the DNS answer.</text>

<!-- left viewpoints -->
<rect x="28" y="125" width="205" height="235" fill="#eef6fb" stroke="#073b64" stroke-width="2" rx="18"/>
<rect x="28" y="125" width="205" height="42" fill="#073b64" rx="18"/><text x="130" y="153" text-anchor="middle" class="h" font-size="18">External / extranet view</text>
<rect x="48" y="190" width="165" height="58" fill="#f5f8fb" class="b"/><text x="130" y="216" text-anchor="middle" class="tx" font-size="16" font-weight="bold">External customer DNS</text><text x="130" y="237" text-anchor="middle" class="tx" font-size="14">delegated / querying GTM</text>
<rect x="48" y="270" width="165" height="66" fill="#ebf8e9" class="b"/><text x="130" y="297" text-anchor="middle" class="tx" font-size="16" font-weight="bold">H3 external-side prober</text><text x="130" y="320" text-anchor="middle" class="tx" font-size="13">preferred user-path vantage</text>

<rect x="28" y="430" width="205" height="255" fill="#eef6fb" stroke="#073b64" stroke-width="2" rx="18"/>
<rect x="28" y="430" width="205" height="42" fill="#073b64" rx="18"/><text x="130" y="458" text-anchor="middle" class="h" font-size="18">Internal enterprise view</text>
<rect x="48" y="495" width="165" height="58" fill="#f5f8fb" class="b"/><text x="130" y="520" text-anchor="middle" class="tx" font-size="16" font-weight="bold">Internal enterprise DNS</text><text x="130" y="542" text-anchor="middle" class="tx" font-size="13">delegates selected names</text>
<rect x="48" y="575" width="165" height="70" fill="#ebf8e9" class="b"/><text x="130" y="603" text-anchor="middle" class="tx" font-size="16" font-weight="bold">H4 internal-side prober</text><text x="130" y="626" text-anchor="middle" class="tx" font-size="13">before internal firewall</text>

<!-- Site 1 -->
<rect x="265" y="115" width="500" height="625" fill="white" stroke="#073b64" stroke-width="2" rx="18"/>
<rect x="265" y="115" width="500" height="48" fill="#073b64" rx="18"/><text x="515" y="148" text-anchor="middle" class="h" font-size="25">Site 1 - Primary</text>
<rect x="290" y="185" width="450" height="62" fill="#dcf5f8" class="b"/><text x="515" y="211" text-anchor="middle" class="tx" font-size="18" font-weight="bold">2 x HA edge-firewall pairs / external application VIPs</text><text x="515" y="234" text-anchor="middle" class="tx" font-size="14">2 devices per HA pair</text>
<rect x="300" y="270" width="160" height="62" fill="#dff5c1" class="b"/><text x="380" y="297" text-anchor="middle" class="tx" font-size="17" font-weight="bold">GTM / DNS cluster</text><text x="380" y="319" text-anchor="middle" class="tx" font-size="13">site/global decision plane</text>
<rect x="495" y="270" width="120" height="62" fill="#dcf5f8" class="b"/><text x="555" y="298" text-anchor="middle" class="tx" font-size="17" font-weight="bold">Tenant LTM</text><text x="555" y="319" text-anchor="middle" class="tx" font-size="13">local delivery</text>
<rect x="635" y="270" width="105" height="62" fill="#ccefed" class="b"/><text x="688" y="307" text-anchor="middle" class="tx" font-size="18" font-weight="bold">WAF</text>
<path d="M515 247 L555 270" class="flow"/><path d="M615 301 H635" class="flow"/>

<rect x="290" y="355" width="205" height="66" fill="#dcf5f8" class="b"/><text x="393" y="383" text-anchor="middle" class="tx" font-size="16" font-weight="bold">Internal service VIP / LTM</text><text x="393" y="406" text-anchor="middle" class="tx" font-size="13">internal published endpoint</text>
<rect x="535" y="355" width="165" height="66" fill="#dcf5f8" class="b"/><text x="618" y="383" text-anchor="middle" class="tx" font-size="16" font-weight="bold">Internal firewall</text><text x="618" y="406" text-anchor="middle" class="tx" font-size="13">enterprise - private cloud boundary</text>
<path d="M495 388 H535" class="flow"/>

<rect x="285" y="455" width="455" height="230" fill="#ede8ff" stroke="#5c4cd2" stroke-width="3" rx="24"/>
<rect x="330" y="455" width="365" height="38" fill="#5c4cd2" rx="10"/><text x="512" y="481" text-anchor="middle" class="h" font-size="18">Site 1 private cloud</text>
<rect x="325" y="525" width="105" height="52" fill="#dcf5f8" class="b"/><text x="378" y="557" text-anchor="middle" class="tx" font-size="18" font-weight="bold">CFW</text>
<rect x="465" y="525" width="115" height="52" fill="#dcf5f8" class="b"/><text x="523" y="557" text-anchor="middle" class="tx" font-size="18" font-weight="bold">ELB / service</text>
<rect x="615" y="525" width="100" height="52" fill="#dff5c1" class="b"/><text x="665" y="557" text-anchor="middle" class="tx" font-size="18" font-weight="bold">App ready</text>
<path d="M430 551 H465" class="flow"/><path d="M580 551 H615" class="flow"/>
<path d="M688 332 C665 405,555 455,378 525" class="flow"/>
<path d="M618 421 L378 525" class="flow"/>
<rect x="430" y="610" width="170" height="48" fill="#ebf8e9" stroke="#5ca452" stroke-width="2" rx="12"/><text x="515" y="640" text-anchor="middle" class="tx" font-size="15" font-weight="bold">H2 local member health</text>

<!-- Site 2 -->
<rect x="800" y="115" width="500" height="625" fill="white" stroke="#073b64" stroke-width="2" rx="18"/>
<rect x="800" y="115" width="500" height="48" fill="#073b64" rx="18"/><text x="1050" y="148" text-anchor="middle" class="h" font-size="25">Site 2 - DR / Secondary</text>
<rect x="825" y="185" width="450" height="62" fill="#dcf5f8" class="b"/><text x="1050" y="211" text-anchor="middle" class="tx" font-size="18" font-weight="bold">2 x HA edge-firewall pairs / external application VIPs</text><text x="1050" y="234" text-anchor="middle" class="tx" font-size="14">2 devices per HA pair</text>
<rect x="835" y="270" width="160" height="62" fill="#dff5c1" class="b"/><text x="915" y="297" text-anchor="middle" class="tx" font-size="17" font-weight="bold">GTM / DNS cluster</text><text x="915" y="319" text-anchor="middle" class="tx" font-size="13">site/global decision plane</text>
<rect x="1030" y="270" width="120" height="62" fill="#dcf5f8" class="b"/><text x="1090" y="298" text-anchor="middle" class="tx" font-size="17" font-weight="bold">Tenant LTM</text><text x="1090" y="319" text-anchor="middle" class="tx" font-size="13">local delivery</text>
<rect x="1170" y="270" width="105" height="62" fill="#ccefed" class="b"/><text x="1223" y="307" text-anchor="middle" class="tx" font-size="18" font-weight="bold">WAF</text>
<path d="M1050 247 L1090 270" class="flow"/><path d="M1150 301 H1170" class="flow"/>

<rect x="825" y="355" width="205" height="66" fill="#dcf5f8" class="b"/><text x="928" y="383" text-anchor="middle" class="tx" font-size="16" font-weight="bold">Internal service VIP / LTM</text><text x="928" y="406" text-anchor="middle" class="tx" font-size="13">internal published endpoint</text>
<rect x="1070" y="355" width="165" height="66" fill="#dcf5f8" class="b"/><text x="1153" y="383" text-anchor="middle" class="tx" font-size="16" font-weight="bold">Internal firewall</text><text x="1153" y="406" text-anchor="middle" class="tx" font-size="13">enterprise - private cloud boundary</text>
<path d="M1030 388 H1070" class="flow"/>

<rect x="820" y="455" width="455" height="230" fill="#ede8ff" stroke="#5c4cd2" stroke-width="3" rx="24"/>
<rect x="865" y="455" width="365" height="38" fill="#5c4cd2" rx="10"/><text x="1048" y="481" text-anchor="middle" class="h" font-size="18">Site 2 private cloud</text>
<rect x="860" y="525" width="105" height="52" fill="#dcf5f8" class="b"/><text x="913" y="557" text-anchor="middle" class="tx" font-size="18" font-weight="bold">CFW</text>
<rect x="1000" y="525" width="115" height="52" fill="#dcf5f8" class="b"/><text x="1058" y="557" text-anchor="middle" class="tx" font-size="18" font-weight="bold">ELB / service</text>
<rect x="1150" y="525" width="100" height="52" fill="#dff5c1" class="b"/><text x="1200" y="557" text-anchor="middle" class="tx" font-size="18" font-weight="bold">App ready</text>
<path d="M965 551 H1000" class="flow"/><path d="M1115 551 H1150" class="flow"/>
<path d="M1223 332 C1200 405,1090 455,913 525" class="flow"/>
<path d="M1153 421 L913 525" class="flow"/>
<rect x="965" y="610" width="170" height="48" fill="#ebf8e9" stroke="#5ca452" stroke-width="2" rx="12"/><text x="1050" y="640" text-anchor="middle" class="tx" font-size="15" font-weight="bold">H2 local member health</text>

<!-- GTM sync and authoritative signals -->
<path d="M460 300 H835" class="sync"/><path d="M835 320 H460" class="sync"/><text x="648" y="286" text-anchor="middle" class="tx" font-size="14" fill="#0f8b8d">GTM sync / global state</text>
<path d="M555 332 C525 345,480 335,430 320" class="health"/><text x="458" y="350" class="tx" font-size="13" fill="#0f8b8d">iQuery / local VS health</text>
<path d="M1090 332 C1060 345,1015 335,965 320" class="health"/><text x="994" y="350" class="tx" font-size="13" fill="#0f8b8d">iQuery / local VS health</text>

<!-- DNS control paths -->
<path d="M213 218 C255 218,285 250,300 300" class="dns"/><text x="236" y="247" class="tx" font-size="12" fill="#d17714">external DNS query</text>
<path d="M213 524 C260 490,310 380,350 320" class="dns"/><text x="238" y="485" class="tx" font-size="12" fill="#d17714">delegated internal name</text>

<!-- H3/H4 health paths -->
<path d="M213 303 C255 275,280 235,290 215" class="health"/><text x="228" y="286" class="tx" font-size="13" fill="#0f8b8d">H3 external L7</text>
<path d="M213 610 C255 555,285 460,290 388" class="health"/><text x="222" y="588" class="tx" font-size="13" fill="#0f8b8d">H4 internal L7</text>
<path d="M213 303 C505 165,780 155,825 215" class="health"/>
<path d="M213 610 C545 760,790 600,825 388" class="health"/>

<!-- right callouts -->
<rect x="1330" y="125" width="240" height="325" fill="#ebf8e9" stroke="#073b64" stroke-width="2" rx="18"/>
<rect x="1330" y="125" width="240" height="44" fill="#073b64" rx="18"/><text x="1450" y="155" text-anchor="middle" class="h" font-size="19">App health contract</text>
<text x="1350" y="205" class="tx" font-size="15">• Host / SNI + URI</text>
<text x="1350" y="238" class="tx" font-size="15">• Expected status / body</text>
<text x="1350" y="271" class="tx" font-size="15">• Auth / cert / token</text>
<text x="1350" y="304" class="tx" font-size="15">• Critical dependencies only</text>
<text x="1350" y="337" class="tx" font-size="15">• Timeout / drain semantics</text>
<text x="1350" y="370" class="tx" font-size="15">• Named application owner</text>
<text x="1350" y="412" class="tx" font-size="14" font-weight="bold">Avoid false green and false red.</text>

<rect x="1330" y="480" width="240" height="170" fill="#f5f8fb" stroke="#0f8b8d" stroke-width="2" rx="18"/>
<text x="1450" y="516" text-anchor="middle" class="tx" font-size="19" font-weight="bold" fill="#0f8b8d">H6 independent synthetic</text>
<text x="1350" y="552" class="tx" font-size="15">• external user-like transaction</text>
<text x="1350" y="585" class="tx" font-size="15">• internal user-like transaction</text>
<text x="1350" y="618" class="tx" font-size="15">• API/business transaction</text>
<text x="1350" y="644" class="tx" font-size="13">SLO evidence; usually not sole steering signal</text>

<rect x="70" y="790" width="1460" height="65" fill="#ebf8e9" stroke="#5ca452" stroke-width="2" rx="14"/>
<text x="800" y="817" text-anchor="middle" class="tx" font-size="16" font-weight="bold">Decision owner vs probe origin: GTM owns the DNS/site decision, but the probe must exercise the relevant external or internal path.</text>
<text x="800" y="841" text-anchor="middle" class="tx" font-size="15">A GTM-originated check from inside the edge is useful application health, but it does not automatically prove customer leased-line / outside-to-inside firewall reachability.</text>
</svg>