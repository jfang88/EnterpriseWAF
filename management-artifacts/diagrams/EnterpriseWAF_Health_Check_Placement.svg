<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>.tx{font-family:Liberation Sans,Arial,sans-serif;fill:#162432}.sub{font-family:Liberation Sans,Arial,sans-serif;fill:#536575}.h{font-family:Liberation Sans,Arial,sans-serif;fill:white;font-weight:bold}.cell{stroke:#d9e6ef;stroke-width:2}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="55" y="58" class="tx" font-size="34" font-weight="bold" fill="#073b64">Where should health checks live? (H1–H6 layers &amp; ownership)</text>
<text x="57" y="92" class="sub" font-size="17">End-to-end health spans multiple teams: F5 GTM owns global DNS decisions, while local checks and readiness contracts live at their owning tiers.</text>

<!-- header -->
<rect x="48" y="132" width="225" height="68" rx="12" fill="#073b64"/><text x="160" y="173" text-anchor="middle" class="h" font-size="16.5">Health layer (H1–H6)</text>
<rect x="273" y="132" width="265" height="68" rx="12" fill="#073b64"/><text x="405" y="173" text-anchor="middle" class="h" font-size="16.5">Decision &amp; team owner</text>
<rect x="538" y="132" width="615" height="68" rx="12" fill="#073b64"/><text x="845" y="173" text-anchor="middle" class="h" font-size="16.5">Preferred probe / health source</text>
<rect x="1153" y="132" width="399" height="68" rx="12" fill="#073b64"/><text x="1352" y="173" text-anchor="middle" class="h" font-size="16.5">Automated action</text>

<!-- rows -->
<g font-size="15">
<rect x="48" y="200" width="225" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="160" y="247" text-anchor="middle" class="tx" font-weight="bold">H1: Device / HA</text>
<rect x="273" y="200" width="265" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="405" y="238" text-anchor="middle" class="tx" font-weight="bold">Native device HA</text><text x="405" y="261" text-anchor="middle" class="sub" font-size="13">F5 / Network / Cloud teams</text>
<rect x="538" y="200" width="615" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="845" y="247" text-anchor="middle" class="tx">peer / process / interface / gateway fail-safe (K16049)</text>
<rect x="1153" y="200" width="399" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="1352" y="247" text-anchor="middle" class="tx">local HA peer takeover only</text>

<rect x="48" y="284" width="225" height="84" rx="10" fill="#ffffff" class="cell"/><text x="160" y="331" text-anchor="middle" class="tx" font-weight="bold">H2: Local pool member</text>
<rect x="273" y="284" width="265" height="84" rx="10" fill="#ffffff" class="cell"/><text x="405" y="322" text-anchor="middle" class="tx" font-weight="bold">LTM / Cloud ELB</text><text x="405" y="345" text-anchor="middle" class="sub" font-size="13">F5/ADC &amp; Cloud Platform</text>
<rect x="538" y="284" width="615" height="84" rx="10" fill="#ffffff" class="cell"/><text x="845" y="320" text-anchor="middle" class="tx">Layer-7 / protocol readiness + Receive Disable drain (K12818)</text><text x="845" y="344" text-anchor="middle" class="sub" font-size="13">pool Action On Service Down = Reject (K15095) • VS Reject on all-down (K40554304)</text>
<rect x="1153" y="284" width="399" height="84" rx="10" fill="#ffffff" class="cell"/><text x="1352" y="331" text-anchor="middle" class="tx">remove 1 failed node locally</text>

<rect x="48" y="368" width="225" height="86" rx="10" fill="#f5f8fb" class="cell"/><text x="160" y="416" text-anchor="middle" class="tx" font-weight="bold">H3: External endpoint</text>
<rect x="273" y="368" width="265" height="86" rx="10" fill="#f5f8fb" class="cell"/><text x="405" y="406" text-anchor="middle" class="tx" font-weight="bold">BIG-IP DNS (GTM)</text><text x="405" y="429" text-anchor="middle" class="sub" font-size="13">F5/ADC + Network/Security</text>
<rect x="538" y="368" width="615" height="86" rx="10" fill="#f5f8fb" class="cell"/><text x="845" y="404" text-anchor="middle" class="tx">external VIP Layer-7 from external/extranet vantage</text><text x="845" y="428" text-anchor="middle" class="sub" font-size="13">or GTM / LTM+iQuery via NAT Translation (K14707) + Specific Prober Pool</text>
<rect x="1153" y="368" width="399" height="86" rx="10" fill="#f5f8fb" class="cell"/><text x="1352" y="416" text-anchor="middle" class="tx">external DNS / site choice</text>

<rect x="48" y="454" width="225" height="86" rx="10" fill="#ffffff" class="cell"/><text x="160" y="502" text-anchor="middle" class="tx" font-weight="bold">H4: Internal endpoint</text>
<rect x="273" y="454" width="265" height="86" rx="10" fill="#ffffff" class="cell"/><text x="405" y="492" text-anchor="middle" class="tx" font-weight="bold">BIG-IP DNS (GTM)</text><text x="405" y="515" text-anchor="middle" class="sub" font-size="13">F5/ADC + Internal DNS/FW</text>
<rect x="538" y="454" width="615" height="86" rx="10" fill="#ffffff" class="cell"/><text x="845" y="490" text-anchor="middle" class="tx">internal VIP Layer-7 from internal-network side</text><text x="845" y="514" text-anchor="middle" class="sub" font-size="13">or authoritative internal LTM L7 health exported via iQuery (no dupes K5431)</text>
<rect x="1153" y="454" width="399" height="86" rx="10" fill="#ffffff" class="cell"/><text x="1352" y="502" text-anchor="middle" class="tx">delegated internal site choice</text>

<rect x="48" y="540" width="225" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="160" y="587" text-anchor="middle" class="tx" font-weight="bold">H5: Shared dependency</text>
<rect x="273" y="540" width="265" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="405" y="578" text-anchor="middle" class="tx" font-weight="bold">Service VIP / discovery</text><text x="405" y="601" text-anchor="middle" class="sub" font-size="13">Application &amp; Cloud teams</text>
<rect x="538" y="540" width="615" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="845" y="587" text-anchor="middle" class="tx">App B1 / B2 + critical downstream service readiness</text>
<rect x="1153" y="540" width="399" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="1352" y="587" text-anchor="middle" class="tx">dependency-local recovery</text>

<rect x="48" y="624" width="225" height="84" rx="10" fill="#ffffff" class="cell"/><text x="160" y="662" text-anchor="middle" class="tx" font-weight="bold">H6: Independent</text><text x="160" y="684" text-anchor="middle" class="tx" font-weight="bold">synthetic (SLO)</text>
<rect x="273" y="624" width="265" height="84" rx="10" fill="#ffffff" class="cell"/><text x="405" y="662" text-anchor="middle" class="tx" font-weight="bold">Outside-F5 monitoring</text><text x="405" y="685" text-anchor="middle" class="sub" font-size="13">Observability / SRE team</text>
<rect x="538" y="624" width="615" height="84" rx="10" fill="#ffffff" class="cell"/><text x="845" y="671" text-anchor="middle" class="tx">real external / internal / API end-to-end business transaction</text>
<rect x="1153" y="624" width="399" height="84" rx="10" fill="#ffffff" class="cell"/><text x="1352" y="671" text-anchor="middle" class="tx">99.95% SLO evidence &amp; alerts</text>
</g>

<rect x="55" y="750" width="1490" height="72" rx="12" fill="#ebf8e9" stroke="#5ca452" stroke-width="2"/>
<text x="800" y="780" text-anchor="middle" class="tx" font-size="16.5" font-weight="bold" fill="#073b64">BIG-IP DNS (GTM) is the right place for site/DNS decisions, but not the only monitor layer.</text>
<text x="800" y="806" text-anchor="middle" class="sub" font-size="14.5">Local tiers fix local failures first (H1/H2); GTM steering signals (H3/H4) prove endpoint reachability; H6 synthetic monitoring measures true 99.95% service availability.</text>

<!-- Consistent Deck Footer -->
<text x="55" y="874" class="sub" font-size="13">End-to-end application delivery summary</text>
<text x="1548" y="874" text-anchor="end" class="sub" font-size="13">Nov 2026  •  6</text>
</svg>