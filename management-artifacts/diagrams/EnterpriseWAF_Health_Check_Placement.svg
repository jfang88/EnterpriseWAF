<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>.tx{font-family:Liberation Sans,Arial,sans-serif;fill:#162432}.sub{font-family:Liberation Sans,Arial,sans-serif;fill:#536575}.h{font-family:Liberation Sans,Arial,sans-serif;fill:white;font-weight:bold}.cell{stroke:#d9e6ef;stroke-width:2}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="55" y="58" class="tx" font-size="36" font-weight="bold" fill="#073b64">Where should health checks live?</text>
<text x="57" y="94" class="sub" font-size="18">GTM owns global endpoint decisions; probe origin and local member checks remain path-specific.</text>

<!-- header -->
<rect x="48" y="132" width="190" height="68" rx="12" fill="#073b64"/><text x="143" y="173" text-anchor="middle" class="h" font-size="17">Health layer</text>
<rect x="238" y="132" width="245" height="68" rx="12" fill="#073b64"/><text x="360" y="173" text-anchor="middle" class="h" font-size="17">Decision owner</text>
<rect x="483" y="132" width="645" height="68" rx="12" fill="#073b64"/><text x="806" y="173" text-anchor="middle" class="h" font-size="17">Preferred probe / health source</text>
<rect x="1128" y="132" width="424" height="68" rx="12" fill="#073b64"/><text x="1340" y="173" text-anchor="middle" class="h" font-size="17">Action</text>

<!-- rows -->
<g font-size="15.5">
<rect x="48" y="200" width="190" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="143" y="247" text-anchor="middle" class="tx" font-weight="bold">H1 Device / HA</text>
<rect x="238" y="200" width="245" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="360" y="247" text-anchor="middle" class="tx">native HA</text>
<rect x="483" y="200" width="645" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="806" y="247" text-anchor="middle" class="tx">peer / process / interface / gateway fail-safe (K16049)</text>
<rect x="1128" y="200" width="424" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="1340" y="247" text-anchor="middle" class="tx">local takeover only</text>

<rect x="48" y="284" width="190" height="84" rx="10" fill="#ffffff" class="cell"/><text x="143" y="331" text-anchor="middle" class="tx" font-weight="bold">H2 Local member</text>
<rect x="238" y="284" width="245" height="84" rx="10" fill="#ffffff" class="cell"/><text x="360" y="331" text-anchor="middle" class="tx">LTM / ELB / service tier</text>
<rect x="483" y="284" width="645" height="84" rx="10" fill="#ffffff" class="cell"/><text x="806" y="321" text-anchor="middle" class="tx">member Layer-7 / protocol readiness + Receive Disable drain (K12818)</text><text x="806" y="345" text-anchor="middle" class="sub" font-size="13.5">pool Action On Service Down = Reject (K15095) • VS Reject on all-down (K40554304)</text>
<rect x="1128" y="284" width="424" height="84" rx="10" fill="#ffffff" class="cell"/><text x="1340" y="331" text-anchor="middle" class="tx">remove one failed member locally</text>

<rect x="48" y="368" width="190" height="86" rx="10" fill="#f5f8fb" class="cell"/><text x="143" y="416" text-anchor="middle" class="tx" font-weight="bold">H3 External endpoint</text>
<rect x="238" y="368" width="245" height="86" rx="10" fill="#f5f8fb" class="cell"/><text x="360" y="416" text-anchor="middle" class="tx" font-weight="bold">GTM-owned</text>
<rect x="483" y="368" width="645" height="86" rx="10" fill="#f5f8fb" class="cell"/><text x="806" y="405" text-anchor="middle" class="tx">external VIP Layer-7 from external/extranet-representative vantage</text><text x="806" y="429" text-anchor="middle" class="sub" font-size="13.5">or direct GTM / LTM+iQuery via NAT Translation (K14707) + Specific Prober Pool</text>
<rect x="1128" y="368" width="424" height="86" rx="10" fill="#f5f8fb" class="cell"/><text x="1340" y="416" text-anchor="middle" class="tx">external DNS / site choice</text>

<rect x="48" y="454" width="190" height="86" rx="10" fill="#ffffff" class="cell"/><text x="143" y="502" text-anchor="middle" class="tx" font-weight="bold">H4 Internal endpoint</text>
<rect x="238" y="454" width="245" height="86" rx="10" fill="#ffffff" class="cell"/><text x="360" y="502" text-anchor="middle" class="tx" font-weight="bold">GTM-owned</text>
<rect x="483" y="454" width="645" height="86" rx="10" fill="#ffffff" class="cell"/><text x="806" y="491" text-anchor="middle" class="tx">internal VIP Layer-7 from internal-network side</text><text x="806" y="515" text-anchor="middle" class="sub" font-size="13.5">or authoritative internal LTM Layer-7 health exported through iQuery (avoid dupes K5431)</text>
<rect x="1128" y="454" width="424" height="86" rx="10" fill="#ffffff" class="cell"/><text x="1340" y="502" text-anchor="middle" class="tx">delegated-name / internal site choice</text>

<rect x="48" y="540" width="190" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="143" y="587" text-anchor="middle" class="tx" font-weight="bold">H5 Dependency</text>
<rect x="238" y="540" width="245" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="360" y="587" text-anchor="middle" class="tx">service VIP / discovery</text>
<rect x="483" y="540" width="645" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="806" y="587" text-anchor="middle" class="tx">B1 / B2 + critical downstream service readiness</text>
<rect x="1128" y="540" width="424" height="84" rx="10" fill="#f5f8fb" class="cell"/><text x="1340" y="587" text-anchor="middle" class="tx">dependency-local recovery</text>

<rect x="48" y="624" width="190" height="84" rx="10" fill="#ffffff" class="cell"/><text x="143" y="671" text-anchor="middle" class="tx" font-weight="bold">H6 SLO synthetic</text>
<rect x="238" y="624" width="245" height="84" rx="10" fill="#ffffff" class="cell"/><text x="360" y="671" text-anchor="middle" class="tx">independent monitoring</text>
<rect x="483" y="624" width="645" height="84" rx="10" fill="#ffffff" class="cell"/><text x="806" y="671" text-anchor="middle" class="tx">real external / internal / API business transaction</text>
<rect x="1128" y="624" width="424" height="84" rx="10" fill="#ffffff" class="cell"/><text x="1340" y="671" text-anchor="middle" class="tx">SLO / alerting / failover validation</text>
</g>

<rect x="55" y="750" width="1490" height="72" rx="12" fill="#ebf8e9" stroke="#5ca452" stroke-width="2"/>
<text x="800" y="780" text-anchor="middle" class="tx" font-size="17" font-weight="bold" fill="#073b64">GTM is the right place for the site/DNS decision, but not the only monitor layer.</text>
<text x="800" y="806" text-anchor="middle" class="sub" font-size="15">Local tiers fix local failures first; the GTM steering signal should prove the published endpoint path closely enough to justify site selection.</text>

<!-- Consistent Deck Footer -->
<text x="55" y="874" class="sub" font-size="13">EnterpriseWAF management summary</text>
<text x="1548" y="874" text-anchor="end" class="sub" font-size="13">Nov 2026  •  6</text>
</svg>