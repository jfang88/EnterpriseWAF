<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>.tx{font-family:Arial,sans-serif;fill:#162432}.h{font-family:Arial,sans-serif;fill:white;font-weight:bold}.cell{stroke:#d9e6ef;stroke-width:2}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="62" y="62" class="tx" font-size="39" font-weight="bold" fill="#073b64">Where should health checks live?</text>
<text x="65" y="104" class="tx" font-size="20" fill="#536575">GTM owns global endpoint decisions; probe origin and local member checks remain path-specific.</text>

<!-- header -->
<rect x="48" y="155" width="180" height="82" rx="14" fill="#073b64"/><text x="138" y="205" text-anchor="middle" class="h" font-size="18">Health layer</text>
<rect x="228" y="155" width="245" height="82" rx="14" fill="#073b64"/><text x="350" y="205" text-anchor="middle" class="h" font-size="18">Decision owner</text>
<rect x="473" y="155" width="645" height="82" rx="14" fill="#073b64"/><text x="796" y="205" text-anchor="middle" class="h" font-size="18">Preferred probe / health source</text>
<rect x="1118" y="155" width="435" height="82" rx="14" fill="#073b64"/><text x="1335" y="205" text-anchor="middle" class="h" font-size="18">Action</text>

<!-- row helper manually -->
<g font-size="16">
<rect x="48" y="237" width="180" height="82" rx="12" fill="#f5f8fb" class="cell"/><text x="138" y="283" text-anchor="middle" class="tx">H1 Device / HA</text>
<rect x="228" y="237" width="245" height="82" rx="12" fill="#f5f8fb" class="cell"/><text x="350" y="283" text-anchor="middle" class="tx">native HA</text>
<rect x="473" y="237" width="645" height="82" rx="12" fill="#f5f8fb" class="cell"/><text x="796" y="283" text-anchor="middle" class="tx">peer / process / interface health</text>
<rect x="1118" y="237" width="435" height="82" rx="12" fill="#f5f8fb" class="cell"/><text x="1335" y="283" text-anchor="middle" class="tx">local takeover only</text>

<rect x="48" y="319" width="180" height="82" rx="12" fill="#ffffff" class="cell"/><text x="138" y="365" text-anchor="middle" class="tx">H2 Local member</text>
<rect x="228" y="319" width="245" height="82" rx="12" fill="#ffffff" class="cell"/><text x="350" y="365" text-anchor="middle" class="tx">LTM / ELB / service tier</text>
<rect x="473" y="319" width="645" height="82" rx="12" fill="#ffffff" class="cell"/><text x="796" y="365" text-anchor="middle" class="tx">member Layer-7 / protocol readiness</text>
<rect x="1118" y="319" width="435" height="82" rx="12" fill="#ffffff" class="cell"/><text x="1335" y="365" text-anchor="middle" class="tx">remove one failed member locally</text>

<rect x="48" y="401" width="180" height="82" rx="12" fill="#f5f8fb" class="cell"/><text x="138" y="447" text-anchor="middle" class="tx">H3 External endpoint</text>
<rect x="228" y="401" width="245" height="82" rx="12" fill="#f5f8fb" class="cell"/><text x="350" y="447" text-anchor="middle" class="tx" font-weight="bold">GTM-owned</text>
<rect x="473" y="401" width="645" height="82" rx="12" fill="#f5f8fb" class="cell"/><text x="796" y="437" text-anchor="middle" class="tx">external VIP Layer-7 from external/extranet-representative vantage</text><text x="796" y="461" text-anchor="middle" class="tx" font-size="14" fill="#536575">or direct GTM/iQuery signal when that path is the best available representation</text>
<rect x="1118" y="401" width="435" height="82" rx="12" fill="#f5f8fb" class="cell"/><text x="1335" y="447" text-anchor="middle" class="tx">external DNS / site choice</text>

<rect x="48" y="483" width="180" height="82" rx="12" fill="#ffffff" class="cell"/><text x="138" y="529" text-anchor="middle" class="tx">H4 Internal endpoint</text>
<rect x="228" y="483" width="245" height="82" rx="12" fill="#ffffff" class="cell"/><text x="350" y="529" text-anchor="middle" class="tx" font-weight="bold">GTM-owned</text>
<rect x="473" y="483" width="645" height="82" rx="12" fill="#ffffff" class="cell"/><text x="796" y="519" text-anchor="middle" class="tx">internal VIP Layer-7 from internal-network side</text><text x="796" y="543" text-anchor="middle" class="tx" font-size="14" fill="#536575">or authoritative internal LTM Layer-7 health exported through iQuery</text>
<rect x="1118" y="483" width="435" height="82" rx="12" fill="#ffffff" class="cell"/><text x="1335" y="529" text-anchor="middle" class="tx">delegated-name / internal site choice</text>

<rect x="48" y="565" width="180" height="82" rx="12" fill="#f5f8fb" class="cell"/><text x="138" y="611" text-anchor="middle" class="tx">H5 Dependency</text>
<rect x="228" y="565" width="245" height="82" rx="12" fill="#f5f8fb" class="cell"/><text x="350" y="611" text-anchor="middle" class="tx">service VIP / discovery</text>
<rect x="473" y="565" width="645" height="82" rx="12" fill="#f5f8fb" class="cell"/><text x="796" y="611" text-anchor="middle" class="tx">B1 / B2 + critical downstream service readiness</text>
<rect x="1118" y="565" width="435" height="82" rx="12" fill="#f5f8fb" class="cell"/><text x="1335" y="611" text-anchor="middle" class="tx">dependency-local recovery</text>

<rect x="48" y="647" width="180" height="82" rx="12" fill="#ffffff" class="cell"/><text x="138" y="693" text-anchor="middle" class="tx">H6 SLO synthetic</text>
<rect x="228" y="647" width="245" height="82" rx="12" fill="#ffffff" class="cell"/><text x="350" y="693" text-anchor="middle" class="tx">independent monitoring</text>
<rect x="473" y="647" width="645" height="82" rx="12" fill="#ffffff" class="cell"/><text x="796" y="693" text-anchor="middle" class="tx">real external / internal / API business transaction</text>
<rect x="1118" y="647" width="435" height="82" rx="12" fill="#ffffff" class="cell"/><text x="1335" y="693" text-anchor="middle" class="tx">SLO / alerting / failover validation</text>
</g>

<rect x="82" y="770" width="1435" height="72" rx="14" fill="#ebf8e9" stroke="#5ca452" stroke-width="2"/>
<text x="800" y="799" text-anchor="middle" class="tx" font-size="18" font-weight="bold" fill="#073b64">GTM is the right place for the site/DNS decision, but not the only monitor layer.</text>
<text x="800" y="826" text-anchor="middle" class="tx" font-size="16" fill="#073b64">Local tiers fix local failures first; the GTM steering signal should prove the published endpoint path closely enough to justify site selection.</text>
</svg>